plugins {
    id 'com.android.application'
}

def mozcVersionFile = rootProject.file('mozc/src/version.bzl')
def mozcVersionParts = [MAJOR: '0', MINOR: '0', BUILD_OSS: '0']
if (mozcVersionFile.exists()) {
    mozcVersionFile.eachLine { line ->
        def matcher = line =~ /^\s*(MAJOR|MINOR|BUILD_OSS)\s*=\s*(\d+)/
        if (matcher.find()) {
            mozcVersionParts[matcher.group(1)] = matcher.group(2)
        }
    }
}
def mozcVersionName = "${mozcVersionParts.MAJOR}.${mozcVersionParts.MINOR}.${mozcVersionParts.BUILD_OSS}"
def appOwnVersion = (project.findProperty('mozcforandroid.version') ?: '1').toString()
def appVersionName = "${mozcVersionName}-${appOwnVersion}"
def appVersionCode = mozcVersionParts.BUILD_OSS.toInteger() * 1000 + appOwnVersion.toInteger()

android {
    compileSdk 34

    defaultConfig {
        applicationId "org.mozc.android.inputmethod.japanese"
        minSdk 22
        targetSdk 34
        versionName appVersionName
        versionCode appVersionCode
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'org.mozc.android.inputmethod.japanese'
}


def mozcSrcDir = file("${rootDir}/mozc/src")
def mozcPatchDir = rootProject.file('patches/mozc')
def mozcCacheDirAndroid = rootProject.file(".mozc-bazel-cache/android")
def mozcCacheDirData = rootProject.file(".mozc-bazel-cache/oss_linux")
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mozcAndroidSdkHome = System.getenv('ANDROID_SDK_HOME')
        ?: System.getenv('ANDROID_HOME')
        ?: System.getenv('ANDROID_SDK_BUILD_DIR')
        ?: localProperties['sdk.dir']

def findCacheFile = { cacheDir, fileName ->
    def found = null
    def dir = cacheDir
    if (dir.exists()) {
        dir.eachFileRecurse { f ->
            if (f.isFile() && f.name == fileName) found = f
        }
    }
    return found
}

tasks.register('ensureMozcSubmodule') {
    group = 'mozc'
    description = 'Initialize the mozc submodule (if needed) and apply the local patches to it.'
    doLast {
        def mozcDir = file("${rootDir}/mozc")
        if (!new File(mozcDir, 'src/BUILD.bazel').exists()) {
            project.logger.lifecycle('Initializing mozc submodule (recursive)...')
            def initProc = new ProcessBuilder(['git', 'submodule', 'update', '--init', '--recursive', 'mozc'])
                    .directory(rootProject.projectDir).start()
            initProc.waitFor()
            if (initProc.exitValue() != 0) {
                throw new GradleException('git submodule update --init --recursive mozc failed')
            }
        }

        // Fast path: a marker holding the submodule HEAD + a hash of the patch files means the
        // patches are in place and nothing changed — skip every subprocess we would otherwise
        // spawn. The marker is deliberately not a Gradle output: the submodule is hidden from
        // git (ignore = dirty), so no file underneath it can stand in for it.
        def patchFiles = mozcPatchDir.listFiles()?.sort { it.name } ?: []
        def headProc = new ProcessBuilder(['git', '-C', mozcDir.toString(), 'rev-parse', 'HEAD']).start()
        def currentHead = headProc.inputStream.text.trim()
        headProc.waitFor()
        if (headProc.exitValue() != 0) {
            throw new GradleException('git -C mozc rev-parse HEAD failed (exit ' + headProc.exitValue() + ')')
        }
        def md = java.security.MessageDigest.getInstance('SHA-256')
        patchFiles.each { f -> md.update(f.bytes) }
        def patchHash = md.digest().collect { String.format('%02x', it) }.join('')
        def markerFile = rootProject.file('.mozc-bazel-cache/patches.marker')
        def storedMarker = markerFile.exists() ? markerFile.text.trim() : null
        if (storedMarker == "${currentHead}|${patchHash}") {
            project.logger.lifecycle('Mozc submodule patches already applied')
            return
        }

        def applyPatch = { patchFilePath ->
            def patchFileName = new File(patchFilePath).name
            def mozcDirPath = "${rootDir}/mozc"
            def checkProc = new ProcessBuilder(['git', '-C', mozcDirPath.toString(), 'apply', '--check', patchFilePath.toString()]).start()
            if (checkProc.waitFor() == 0) {
                def applyProc = new ProcessBuilder(['git', '-C', mozcDirPath.toString(), 'apply', patchFilePath.toString()]).start()
                if (applyProc.waitFor() != 0) {
                    throw new GradleException("failed to apply ${patchFileName}")
                }
                project.logger.lifecycle("Applied ${patchFileName}")
            } else {
                def reverseProc = new ProcessBuilder(['git', '-C', mozcDirPath.toString(), 'apply', '--check', '--reverse', patchFilePath.toString()]).start()
                if (reverseProc.waitFor() == 0) {
                    project.logger.lifecycle("${patchFileName} already applied")
                } else {
                    throw new GradleException("patch ${patchFileName} does not apply to mozc")
                }
            }
        }

        mozcPatchDir.eachFile { applyPatch(it.absolutePath) }

        markerFile.parentFile.mkdirs()
        markerFile.text = "${currentHead}|${patchHash}"
        project.logger.lifecycle("Wrote patch marker (${patchFiles.size()} patch(es), HEAD ${currentHead})")
    }
}


// The supplementary dictionaries. Downloads are skipped for any source whose installed file
// already exists and passes the format check (see scripts/fetch_dictionaries.py), so a fresh
// build downloads exactly once and every later build does nothing.
//
// A failed fetch is fatal by default; skip it with -PskipFetchDictionaries=true (or answer
// "y" to the interactive prompt in a terminal — Gradle daemons usually have no console, so
// the property is the reliable path) and the build continues with whatever is on disk.
tasks.register('fetchDictionaries') {
    group = 'mozc'
    description = 'Fetch the supplementary dictionaries into third_party/dictionaries (skips sources whose installed files pass the format check).'
    outputs.files(
        rootProject.file('third_party/dictionaries/dic-nico-intersection-pixiv.txt'),
        rootProject.file('third_party/dictionaries/katakana-english.txt'),
        rootProject.file('third_party/dictionaries/jawiki.txt')
    )
    doLast {
        def fetchScript = rootProject.file('scripts/fetch_dictionaries.py')
        def proc = new ProcessBuilder('python3', fetchScript.absolutePath).start()
        def err = new StringBuffer()
        def errReader = new Thread({
            proc.errorStream.text.eachLine { err.append(it).append('\n') }
        } as Runnable)
        errReader.daemon = true
        errReader.start()
        def out = proc.inputStream.text
        def exitCode = proc.waitFor()
        errReader.join(5000)
        if (out.trim()) {
            out.trim().eachLine { project.logger.lifecycle(it) }
        }
        if (err.length() > 0) {
            err.toString().eachLine { project.logger.lifecycle(it) }
        }
        if (exitCode != 0) {
            def skip = project.findProperty('skipFetchDictionaries')
            def skipRequested = skip != null && String.valueOf(skip).trim().toLowerCase() in ['true', '1', 'yes', 'on']
            def promptAnswer = null
            def console = System.console()
            if (console != null) {
                try {
                    promptAnswer = console.readLine('fetchDictionaries failed — continue without the supplementary dictionaries? [y/N] ')
                } catch (Exception ignored) {
                    promptAnswer = null
                }
            }
            if (skipRequested || (promptAnswer != null && promptAnswer.trim().toLowerCase() in ['y', 'yes'])) {
                project.logger.warn('fetchDictionaries failed; continuing without the supplementary dictionaries (generateSystemDictionary stages whatever is on disk)')
                return
            }
            throw new GradleException("fetch_dictionaries.py failed (exit ${exitCode}); pass -PskipFetchDictionaries=true to continue without the supplementary dictionaries")
        }
    }
}


tasks.register('generateSystemDictionary') {
    group = 'mozc'
    description = 'Generate dictionary10.txt (bundled supplementary words) into the mozc dictionary sources.'
    dependsOn 'ensureMozcSubmodule'
    dependsOn 'fetchDictionaries'
    inputs.files(rootProject.fileTree('third_party/dictionaries'))
    outputs.file("${mozcSrcDir}/data/dictionary_oss/dictionary10.txt")
    doLast {
        def genScript = rootProject.file('scripts/gen_system_dictionary.py')
        def outFile = file("${mozcSrcDir}/data/dictionary_oss/dictionary10.txt")
        outFile.parentFile.mkdirs()
        def proc = new ProcessBuilder('python3', genScript.absolutePath).start()
        def err = new StringBuffer()
        def errReader = new Thread({
            proc.errorStream.text.eachLine { err.append(it).append('\n') }
        } as Runnable)
        errReader.daemon = true
        errReader.start()
        outFile.bytes = proc.inputStream.bytes
        def exitCode = proc.waitFor()
        errReader.join(5000)
        if (exitCode != 0) {
            throw new GradleException("gen_system_dictionary.py failed (exit ${exitCode}):\n" + err.toString())
        }
        if (err.length() > 0) {
            err.toString().eachLine { project.logger.lifecycle(it) }
        }
        project.logger.lifecycle("==> dictionary10.txt written (" + outFile.length() + " bytes)")
    }
}


tasks.register('buildMozcLib', Exec) {
    group = 'mozc'
    description = 'Build the mozc JNI library from the mozc submodule (arm64-v8a).'
    dependsOn 'ensureMozcSubmodule'
    workingDir mozcSrcDir
    commandLine 'bazelisk',
        '--output_user_root=' + mozcCacheDirAndroid.absolutePath,
        'build',
        '--config=oss_android',
        '--jobs=4',
        '//android/jni:mozc.arm64'
    environment 'USE_BAZEL_VERSION', '9.0.2'
}

tasks.register('buildMozcData', Exec) {
    group = 'mozc'
    description = 'Build the Mozc data file (OSS) used by the mobile engine.'
    dependsOn 'generateSystemDictionary'
    workingDir mozcSrcDir
    commandLine 'bazelisk',
        '--output_user_root=' + mozcCacheDirData.absolutePath,
        'build',
        '--config=oss_linux',
        '--jobs=4',
        '//data_manager/oss:mozc_dataset_for_oss'
    environment 'USE_BAZEL_VERSION', '9.0.2'
}

def mozcLibcxxShared = ['28.2.13676358', '27.2.12479018', '27.1.12297006', '27.0.12077973', '26.1.10909125', '25.1.8937393', '23.1.7779620']
    .findResult { v ->
        def f = file("${mozcAndroidSdkHome}/ndk/${v}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")
        f.exists() ? f : null
    }

tasks.register('copyMozcData') {
    group = 'mozc'
    description = 'Copy the built mozc data file into the app assets.'
    dependsOn 'buildMozcData'
    doLast {
        def mozcBuiltData = findCacheFile(mozcCacheDirData, 'mozc.data')
        if (mozcBuiltData == null) {
            throw new GradleException("mozc data file not found in ${mozcCacheDirData}")
        }
        def target = file("${projectDir}/src/main/assets/mozc.data")
        target.parentFile.mkdirs()
        target.bytes = mozcBuiltData.bytes
        project.logger.lifecycle("Copying ${mozcBuiltData} -> ${target}")
    }
}

tasks.register('copyMozcLib') {
    group = 'mozc'
    description = 'Copy the built mozc JNI library into jniLibs.'
    dependsOn 'buildMozcLib'
    doLast {
        def mozcBuiltSo = findCacheFile(mozcCacheDirAndroid, 'libmozc.so')
        if (mozcBuiltSo == null) {
            throw new GradleException("mozc JNI library not found in ${mozcCacheDirAndroid}")
        }
        if (mozcLibcxxShared == null || !mozcLibcxxShared.exists()) {
            throw new GradleException("libc++_shared.so not found")
        }
        def target = file("${projectDir}/src/main/jniLibs/arm64-v8a/libmozc.so")
        def cxxTarget = file("${projectDir}/src/main/jniLibs/arm64-v8a/libc++_shared.so")
        target.parentFile.mkdirs()
        target.bytes = mozcBuiltSo.bytes
        cxxTarget.bytes = mozcLibcxxShared.bytes
        project.logger.lifecycle("Copying ${mozcBuiltSo} -> ${target}")
        project.logger.lifecycle("Copying ${mozcLibcxxShared} -> ${cxxTarget}")
    }
}

afterEvaluate {
    android.buildTypes.each { bt ->
        def preTaskName = "pre${bt.name.capitalize()}Build"
        tasks.named(preTaskName) {
            dependsOn 'copyMozcLib'
            dependsOn 'copyMozcData'
        }
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation files('libs/android-support-v13.jar')
    implementation files('libs/guava.jar')
    implementation files('libs/jsr305.jar')
    implementation files('libs/protobuf-java.jar')
}
